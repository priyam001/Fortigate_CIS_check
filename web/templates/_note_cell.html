<td class="note-cell">
    <textarea class="note-box" data-rule-id="{{ res.rule_id }}" rows="1"
        placeholder="Add a note...">{{ res.notes }}</textarea>
    <div class="note-row-actions">
        <button type="button" class="note-save-btn" onclick="saveNote(this)">Save</button>
        <span class="note-status"></span>
    </div>
</td>
